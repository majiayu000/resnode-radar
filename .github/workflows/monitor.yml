name: Monitor VPS Sources

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run monitor
        run: npm run monitor

      - name: Validate generated data
        run: npm run monitor:validate

      - name: Commit monitor data
        run: |
          if git diff --quiet -- data/products.json; then
            echo "No monitor data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json
          git commit -m "Update monitored VPS data"
          git push
